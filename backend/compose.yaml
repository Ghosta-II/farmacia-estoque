services:
  postgres:
    image: 'postgres:18'
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_DB:-farmacia}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-farmacia}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Defina SPRING_DATASOURCE_PASSWORD no arquivo backend/.env (veja .env.example)}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
