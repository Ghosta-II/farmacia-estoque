version: 2
updates:
  # Bibliotecas do backend (Maven)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # Versões das ações usadas no GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # O frontend (npm) será adicionado quando começar o seu desenvolvimento
