name: CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/farmacia_test
      SPRING_DATASOURCE_USERNAME: farmacia

    steps:
      - uses: actions/checkout@v4

      - name: Gerar senha efêmera do banco
        run: |
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          echo "SPRING_DATASOURCE_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Subir PostgreSQL
        run: |
          docker run -d --name postgres \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_DB=farmacia_test \
            -e POSTGRES_USER=farmacia \
            -e POSTGRES_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            --health-cmd "pg_isready -U farmacia -d farmacia_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:18
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' postgres)"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        run: ./mvnw -B -ntp verify

      - name: Relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
